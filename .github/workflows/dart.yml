name: Dart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test tool
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run trackplan check
      - run: flutter analyze
      - run: flutter test
